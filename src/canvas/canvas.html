<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloe Canvas</title>
  <link rel="stylesheet" href="./canvas.css">
</head>
<body>
  <!-- Header bar -->
  <div id="canvas-header">
    <span class="title">🎨 Cloe Canvas</span>
    <span class="info" id="element-count">0 个元素</span>
    <span class="info" style="margin-left:12px" id="type-count"></span>
    <span class="info" style="margin-left:auto">共同看屏 · T4 粘贴交互 · Cmd+V 粘贴图片/文本/代码</span>
  </div>

  <!-- Canvas workspace (scrollable board) -->
  <div id="canvas-workspace">
    <div id="canvas-board">
      <!-- Elements will be mounted here -->
    </div>
  </div>

  <script type="module" src="./canvas-renderer.js"></script>
</body>
</html>
