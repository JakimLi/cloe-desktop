<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloe Desktop</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Weather effects canvas (behind character) — managed by weather-canvas.js -->
  <canvas id="weather-canvas" style="position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 0.3s ease;"></canvas>

  <!-- Character layer (bottom) — managed by renderer.js (Vanilla JS) -->
  <div id="gif-container">
    <img id="cloe-gif-a" class="cloe-gif-layer" src="/gifs/blink.gif" alt="">
    <img id="cloe-gif-b" class="cloe-gif-layer" src="" alt="">
    <!-- Context usage HUD bar -->
    <div id="context-bar" class="context-bar">
      <div id="context-bar-fill" class="context-bar-fill"></div>
      <span id="context-bar-text" class="context-bar-text">0%</span>
    </div>
  </div>

  <!-- React overlay root — terminal/canvas managed by React -->
  <div id="react-root"></div>

  <!-- Reminder overlay — shows triggered reminder cards below character -->
  <div id="reminder-overlay"></div>

  <div id="ws-status" title="WebSocket">●</div>
  <button id="settings-btn" title="设置">⚙</button>

  <!-- weather-canvas: particle effects behind character -->
  <script type="module" src="/src/weather-canvas.js"></script>
  <!-- renderer.js: GIF animations, audio, WebSocket, idle loop, drag -->
  <script type="module" src="/src/renderer.js"></script>
  <!-- Reminder overlay: card UI + WS listener (loaded after renderer.js) -->
  <script type="module" src="/src/reminder-overlay.js"></script>
  <!-- React app: terminal (xterm), canvas (Excalidraw), titlebar -->
  <script type="module" src="/src/react/main.jsx"></script>
</body>
</html>
